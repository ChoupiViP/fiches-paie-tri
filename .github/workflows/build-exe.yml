name: Construire le .exe Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Compiler en un seul .exe
        run: >
          pyinstaller --onefile --windowed --name TriFichesPaie
          --collect-all pdfplumber --collect-all pdfminer app.py
      - uses: actions/upload-artifact@v4
        with:
          name: TriFichesPaie-windows
          path: dist/TriFichesPaie.exe
      - name: Ajouter le .exe à la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TriFichesPaie.exe
